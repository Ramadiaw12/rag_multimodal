name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Erreurs réelles uniquement : syntaxe et noms indéfinis
      - name: Lint
        run: uvx ruff check --select E9,F63,F7,F82 --extend-exclude "*.ipynb" --extend-exclude notebook_brut.py .
      # Tests légers : sans torch, sans clé API, sans base vectorielle
      - name: Tests
        run: uv run --no-project --with pytest --with langchain-core --with tiktoken pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-multimodal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
